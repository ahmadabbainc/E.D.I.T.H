name: Image spike
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  spike:
    runs-on: ubuntu-latest
    env: { GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}", GH_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node imgtest.mjs
      - name: Publish results as a temporary release
        run: |
          ls out/spike-*.png >/dev/null 2>&1 && gh release create "video-spike-img-$GITHUB_RUN_NUMBER" out/spike-*.png --title "spike" --notes "image spike" || echo "no images made"
