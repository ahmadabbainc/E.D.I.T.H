name: Delete video
run-name: "Delete: ${{ inputs.tag }}"
on:
  workflow_dispatch:
    inputs:
      tag: { description: "Release tag of the video (video-...)", required: true, type: string }
permissions: { contents: write }
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete release and tag
        env: { GH_TOKEN: "${{ github.token }}", TAG: "${{ inputs.tag }}" }
        run: |
          case "$TAG" in video-*) ;; *) echo "refusing: not a video tag"; exit 1;; esac
          echo "$TAG" | grep -Eq '^video-[a-z0-9._-]+$' || { echo "bad tag"; exit 1; }
          gh release delete "$TAG" --cleanup-tag --yes -R "$GITHUB_REPOSITORY"
